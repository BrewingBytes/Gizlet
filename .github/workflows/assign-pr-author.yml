name: Assign pull request author

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  pull-requests: write

jobs:
  assign-author:
    name: Assign author
    runs-on: ubuntu-latest

    steps:
      - name: Assign pull request author
        uses: toshimaru/auto-author-assign@v3.0.3
