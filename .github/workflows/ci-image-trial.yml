# TEMPORARY (BRE-46): measures the official Playwright image against the
# current runner setup on the same commit. Removed before the pull request is
# ready; it is not a gate.
name: CI image trial

on:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    name: Trial / runner, 2 workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests on Chromium
        run: pnpm exec playwright test --project=chromium --workers=2
      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: Browser smoke tests on WebKit
        run: pnpm exec playwright test --project=webkit-smoke --workers=2

  image:
    name: Trial / Playwright image, 2 workers
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report the image's browsers
        run: node --version && ls "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Browser tests on Chromium
        run: pnpm exec playwright test --project=chromium --workers=2
      - name: Browser smoke tests on WebKit
        run: pnpm exec playwright test --project=webkit-smoke --workers=2
