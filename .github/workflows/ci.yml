name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  commit-title:
    name: Commit Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit titles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          invalid_titles="$(git log --format=%s "$BASE_SHA..$HEAD_SHA" | grep -Ev '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+$' || true)"
          if [ -n "$invalid_titles" ]; then
            echo "Commit titles must follow Conventional Commits:"
            echo "$invalid_titles"
            exit 1
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: Built site check
        run: pnpm run site:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Chromium runs the whole suite, `smoke/` included, so a failure that
      # only the WebKit step below shows is a WebKit failure.
      - name: Browser smoke tests
        run: pnpm exec playwright test --project=chromium

      - name: Browser analytics consent tests with measurement configured
        env:
          PUBLIC_ANALYTICS_ENABLED: 'true'
          PUBLIC_GA4_MEASUREMENT_ID: G-TEST1234567
        run: pnpm exec playwright test tests/e2e/analytics-consent.spec.ts

      - name: Browser advertising policy tests with configured slots
        env:
          PUBLIC_ADS_ENABLED: 'true'
          PUBLIC_ADSENSE_CLIENT: ca-pub-1234567890123456
          PUBLIC_ADSENSE_BANNER_SLOT: '1234567890'
          PUBLIC_ADSENSE_INLINE_SLOT: '2345678901'
          PUBLIC_ADSENSE_RAIL_SLOT: '3456789012'
        run: pnpm exec playwright test tests/e2e/advertising.spec.ts

      - name: Browser advertising policy tests without configured slots
        env:
          PUBLIC_ADS_ENABLED: 'true'
          PUBLIC_ADSENSE_CLIENT: ca-pub-1234567890123456
        run: pnpm exec playwright test tests/e2e/advertising.spec.ts

      # Its own install and its own step, so the WebKit cost and any WebKit-only
      # failure read separately from Chromium's. Each Playwright run starts a
      # fresh build and preview of its own, this one included.
      - name: Install Playwright WebKit
        run: pnpm exec playwright install --with-deps webkit

      - name: Browser smoke tests on WebKit
        run: pnpm exec playwright test --project=webkit-smoke
