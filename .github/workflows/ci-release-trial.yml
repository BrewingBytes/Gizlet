# TEMPORARY (BRE-46): Release only runs on a tag, so this exercises its git
# steps inside the Playwright image on the pull request. Removed before the
# pull request is ready; it is not a gate.
name: CI release-git trial

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-git:
    name: Trial / Release git steps in the image
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Negative control, git before the checkout is trusted
        continue-on-error: true
        run: git log -1 --format=%H
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Fetch main and compare history, as the tag check does
        run: |
          git fetch --no-tags --quiet origin main
          git merge-base --is-ancestor FETCH_HEAD HEAD
          echo "main is an ancestor of $(git rev-parse --short HEAD)"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sitemap dates
        run: pnpm run sitemap:dates -- --check
