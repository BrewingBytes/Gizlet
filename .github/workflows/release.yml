name: Release

# Deployment is gated on a version tag, never on a push to main. Cloudflare
# Workers Builds cannot trigger on a tag — it only builds a configured branch —
# so this workflow validates the tagged commit and then fast-forwards the
# `release` branch onto it, which is the branch Cloudflare builds and deploys.
# docs/releasing.md describes the whole path, including the dashboard settings.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag against the release commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $TAG does not match package.json version $package_version."
            exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section."
            exit 1
          fi
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "The tagged commit is not on origin/main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm run test:e2e

  promote:
    name: Promote to release
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A plain fast-forward: `release` only ever moves forward onto a commit
      # that is already on main, so no history is rewritten and no force push is
      # involved. A push that is not a fast-forward fails here instead, which is
      # the re-cut case documented in docs/releasing.md.
      - name: Fast-forward the release branch onto the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"
