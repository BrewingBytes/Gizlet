name: Release

# Deployment is gated on a version tag, never on a push to main. Cloudflare
# Workers Builds cannot trigger on a tag — it only builds a configured branch —
# so this workflow validates the tagged commit and then fast-forwards the
# `release` branch onto it, which is the branch Cloudflare builds and deploys.
# docs/releasing.md describes the whole path, including the dashboard settings.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # The official Playwright image carries Chromium, WebKit and their OS
    # packages, which the runner otherwise installs on every run
    # (docs/ci-performance.md). Its tag must equal the @playwright/test version
    # in pnpm-lock.yaml: tests/unit/ci-workflows.test.ts fails when it does not,
    # and Renovate bumps both together.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Docker's default 64 MB /dev/shm is too small for several Chromiums at
      # once; Playwright's Docker guide recommends sharing the host's IPC.
      options: --ipc=host

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The container runs as root over a checkout the runner's user owns, so
      # git refuses the repository unless it is marked safe. The tag check
      # below and the sitemap dates check both read the history.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check the tag against the release commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $TAG does not match package.json version $package_version."
            exit 1
          fi
          if ! grep -qE "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$version] - YYYY-MM-DD' section."
            exit 1
          fi
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "The tagged commit is not on origin/main."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      # The sitemap's lastmod dates are generated from the git history and
      # committed, so a release could otherwise ship dates that are a Gizlet
      # or two behind. This job is the one place with the full history to
      # check them against, and a release is the only thing that deploys.
      - name: Sitemap dates
        run: pnpm run sitemap:dates -- --check

      - name: Production build
        run: pnpm run build

      - name: Built site check
        run: pnpm run site:check

      # Chromium runs the whole suite, `smoke/` included, so a failure that
      # only the WebKit step below shows is a WebKit failure.
      - name: Browser smoke tests
        run: pnpm exec playwright test --project=chromium

      # Its own step, so a WebKit-only failure reads separately from Chromium's.
      # Each Playwright run starts a fresh build and preview of its own, this
      # one included.
      - name: Browser smoke tests on WebKit
        run: pnpm exec playwright test --project=webkit-smoke

  promote:
    name: Promote to release
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A plain fast-forward: `release` only ever moves forward onto a commit
      # that is already on main, so no history is rewritten and no force push is
      # involved. A push that is not a fast-forward fails here instead, which is
      # the re-cut case documented in docs/releasing.md.
      - name: Fast-forward the release branch onto the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"
